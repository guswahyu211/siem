<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#C53030" />
            <stop offset="100%" stop-color="#DD6B20" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.3" />
        </filter>
    </defs>
    <!-- Background Circle -->
    <circle cx="100" cy="100" r="90" fill="url(#grad)" filter="url(#shadow)" />
    
    <!-- White Inner Ring -->
    <circle cx="100" cy="100" r="75" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.9" />
    
    <!-- Stylized G -->
    <path d="M 120 70 
             A 40 40 0 1 0 120 130 
             L 120 110 
             L 95 110 
             L 95 90 
             L 140 90 
             L 140 140 
             A 60 60 0 1 1 140 60 
             Z" 
          fill="#FFFFFF" />
          
    <!-- Decorative Element (Top Right) -->
    <path d="M 140 40 Q 160 20 180 50 Q 150 70 140 40" fill="#FBD38D" opacity="0.8" />
</svg>
